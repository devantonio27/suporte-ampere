[project]
name = "ampere"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings",
    "langchain-core",
    "langchain-openai",
    "langchain-groq",
    "langgraph>=1.2.24",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ampere"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: usa rede e chaves reais (gasta token). Rode com: -m integration",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
